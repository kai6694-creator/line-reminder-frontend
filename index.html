<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>三菱可菱水 濾心更換提醒</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#e8f4f8;min-height:100vh;padding:16px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.logo{text-align:center;margin-bottom:20px}
.logo h1{font-size:18px;color:#003366;margin-bottom:4px}
.logo p{font-size:13px;color:#888}
label{display:block;font-size:13px;font-weight:600;color:#444;margin:12px 0 4px}
select,input[type=date]{width:100%;padding:10px 12px;border:1.5px solid #cce;border-radius:8px;font-size:14px;font-family:inherit;color:#333}
.btn{width:100%;padding:14px;background:#1976D2;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:16px}
.btn:disabled{background:#aaa}
.hint{font-size:12px;color:#888;margin:4px 0 0}
.ok{text-align:center;padding:32px 0}
.ok-ic{font-size:48px;margin-bottom:8px}
.ok h2{color:#1976D2;margin-bottom:8px}
.sub{font-size:13px;color:#666;margin-top:8px}
#loading{text-align:center;padding:60px 20px;color:#666;font-size:15px}
#err-box{display:none;text-align:center;padding:40px 20px;color:#c00}
#app{display:none}
</style>
</head>
<body>

<div id="loading">⏳ 正在連線 LINE...<br><span style="font-size:12px;color:#aaa">請稍候，最多等待 15 秒</span></div>
<div id="err-box"><div style="font-size:40px;margin-bottom:12px">⚠️</div><div id="err-msg">初始化失敗</div><div style="margin-top:16px;font-size:12px;color:#888">請關閉此頁面，重新從 LINE 開啟連結</div></div>

<div id="app">
<div class="card">
  <div class="logo">
    <h1>💧 三菱可菱水 Cleansui</h1>
    <p>濾心更換提醒設定</p>
  </div>

  <div id="r-form">
    <label>姓名 *</label>
    <input type="text" id="r-name" placeholder="請輸入您的姓名" style="width:100%;padding:10px 12px;border:1.5px solid #cce;border-radius:8px;font-size:14px;font-family:inherit;color:#333;margin-bottom:4px">
    <label>選擇產品類型</label>
    <select id="prod" onchange="showHint()">
      <optgroup label="── 淨水器 ──">
        <option value="90|龍頭型淨水器">龍頭型淨水器（每3個月更換）</option>
        <option value="365|檯面型淨水器">檯面型淨水器（每12個月更換）</option>
        <option value="365|廚下型淨水器">廚下型淨水器（每12個月更換）</option>
      </optgroup>
      <optgroup label="── 淨水壺 ──">
        <option value="90|淨水壺濾心">淨水壺（每3個月更換）</option>
      </optgroup>
      <optgroup label="── 除氯沐浴器 ──">
        <option value="60|ESC21W（除氯沐浴器）">ESC21W（每2個月更換）</option>
        <option value="120|ESC11（除氯沐浴器）">ESC11（每4個月更換）</option>
        <option value="30|ESC31Z（除氯沐浴器）">ESC31Z（每1個月更換）</option>
      </optgroup>
    </select>
    <div id="r-hint" class="hint"></div>
    <label>上次更換 / 安裝日期</label>
    <input type="date" id="r-date">
    <p class="hint">全新安裝請選今天</p>
    <button class="btn" id="r-btn" onclick="doReminder()">✅ 設定更換提醒</button>
  </div>

  <div id="r-ok" class="ok" style="display:none">
    <div class="ok-ic">🎉</div>
    <h2>提醒設定成功！</h2>
    <p id="r-msg"></p>
    <p class="sub">到期前3天及當天將透過 LINE 通知您 💧</p>
  </div>
</div>
</div>

<script>
const LIFF_ID = "2009728428-SfuyDoV1";
const API = "https://line-reminder-backend.onrender.com";
let uid = "";

function showErr(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('err-box').style.display = 'block';
  document.getElementById('err-msg').textContent = msg;
}

function showHint() {
  const v = document.getElementById('prod').value.split('|');
  const H = {'90':'更換週期：每 3 個月','365':'更換週期：每 12 個月','60':'更換週期：每 2 個月','120':'更換週期：每 4 個月','30':'更換週期：每 1 個月'};
  document.getElementById('r-hint').textContent = H[v[0]] || '';
}

const timer = setTimeout(() => showErr('載入逾時，請重新開啟'), 10000);

liff.init({ liffId: LIFF_ID })
  .then(async () => {
    clearTimeout(timer);
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    uid = profile.userId;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    showHint();
  })
  .catch(err => {
    clearTimeout(timer);
    showErr('初始化失敗：' + (err.message || err.code || '未知錯誤') + '\n請從 LINE 重新開啟連結。');
  });

async function doReminder() {
  const userName = document.getElementById('r-name').value.trim();
  if (!userName) { alert('請輸入姓名！'); return; }
  const v = document.getElementById('prod').value.split('|');
  const days = parseInt(v[0]), name = v[1];
  const last = document.getElementById('r-date').value;
  if (!last) { alert('請選擇日期！'); return; }
  const d = new Date(last); d.setDate(d.getDate() + days);
  const next = d.toISOString().split('T')[0];
  const btn = document.getElementById('r-btn');
  btn.disabled = true; btn.textContent = '⏳ 儲存中...';
  try {
    const r = await fetch(API + '/api/reminder', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({userId:uid, userName:userName, nextDate:next, productDays:days, productName:name})
    });
    if (!r.ok) throw new Error('伺服器錯誤 ' + r.status);
    document.getElementById('r-form').style.display = 'none';
    document.getElementById('r-ok').style.display = 'block';
    document.getElementById('r-msg').textContent = '姓名：' + userName + '\n產品類型：' + name + '\n下次更換日：' + next;
    try {
      if (liff.isInClient()) {
        await liff.sendMessages([{ type: 'text', text: 'KIDA_提醒設定完成' }]);
      }
    } catch(e) { console.log('trigger:', e.message); }
  } catch(e) {
    alert('設定失敗：' + e.message);
    btn.disabled = false; btn.textContent = '✅ 設定更換提醒';
  }
}
</script>
</body>
</html>
